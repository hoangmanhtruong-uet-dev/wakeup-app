name: wakeup_app
description: "Ứng dụng báo thức WakeUp+"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.14.0
  sqlcipher_flutter_libs: any
  path_provider: ^2.1.2
  path: ^1.9.0
  permission_handler: ^11.3.0
  just_audio: ^0.9.36
  home_widget: ^0.3.1
  purchases_flutter: any
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.5.0
  dio: ^5.4.0
  crypto: ^3.0.3
  firebase_core: ^2.24.2
  firebase_crashlytics: ^3.4.9
  mixpanel_flutter: ^2.2.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0E111A"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

# ⚠️ CỐ Ý KHÔNG khai báo `assets/sounds/`:
#
# 12 file nhạc chuông chỉ được phát ở TẦNG NATIVE, không có code Dart nào đọc chúng:
#   - Android: `android/app/src/main/res/raw/`  -> AlarmService dùng `R.raw.xxx`
#   - iOS:     `ios/Runner/Sounds/`            -> AlarmScheduler/AlarmAudioPlayer dùng Bundle
#
# Nếu khai báo ở đây, 12 file sẽ bị đóng gói 2 LẦN (assets + res/raw),
# vô ích lãng phí ~2.6 MB trong mỗi bản APK/AAB.
#
# Thư mục `assets/sounds/` chỉ là nơi sinh file gốc, xem tools/generate_alarm_sounds.py.
# Đổi danh sách nhạc chuông thì chạy:
#     python tools/generate_alarm_sounds.py
#     python tools/register_ios_sounds.py
